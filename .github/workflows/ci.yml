
name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terraform-scanner
  cancel-in-progress: false

jobs:
  foundation:
    name: "Foundation Format and Validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foundation
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Format and Validate
        run: |
          terraform fmt -check -recursive
          terraform validate

  dev:
    name: "Dev Format and Validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Format and Validate
        run: |
          terraform fmt -check -recursive
          terraform validate

  production:
    name: "Production Format and Validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Format and Validate
        run: |
          terraform fmt -check -recursive
          terraform validate

  tests:
    name: "Python Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: pytest -q
