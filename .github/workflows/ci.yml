name: CI
on:
  pull_request:
    branches: 
      - main


permissions: 
  id-token: write
  contents: read

concurrency: 
  group: terraform-scanner
  cancel-in-progress: false 


jobs: 
  test :
    name: "Test and Plan"
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show OIDC claims
        run: |
          python3 - <<'EOF'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          tok = json.load(urllib.request.urlopen(req))["value"]
          p = tok.split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print({k: c.get(k) for k in ("sub", "aud", "repository", "ref")})
          EOF
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::889992886230:role/github-actions-terraform-role
          aws-region: us-east-1

      - name: Setup Terraform 
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init 
        run: terraform init -input=false
      
      - name: Terraform Format & Validate
        run: |
          terraform fmt -check 
          terraform validate
      
      - name: Terraform Plan 
        run: terraform plan -input=false
    

      - name: install boto3
        run: pip install boto3
      
      - name: install pytest
        run: pip install -U pytest

      - name: run pytest 
        run: pytest