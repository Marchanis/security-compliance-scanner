name: CI
on:
  pull_request:
    branches: 
      - main


permissions: 
  id-token: write
  contents: read

concurrency: 
  group: terraform-scanner
  cancel-in-progress: false 


jobs: 
  test :
    name: "Test and Plan"
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("OIDC audience:", payload.aud);
            console.log("OIDC subject:", payload.sub);
            console.log("OIDC issuer:", payload.iss);
              
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::889992886230:role/github-action-oidc
          aws-region: us-east-1

      - name: Setup Terraform 
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init 
        run: terraform init -input=false

      
      - name: Terraform Format & Validate
        run: |

          terraform fmt -check 
          terraform validate
      
      - name: Terraform Plan 
        run: terraform plan -input=false
    

      - name: install boto3
        run: pip install boto3
      
      - name: install pytest
        run: pip install -U pytest

      - name: run pytest 
        run: pytest